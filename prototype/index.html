<title>外贸超级工作台</title>
<meta name="description" content="外贸超级工作台 M0 可点击原型：订单列表、订单菜单、单证模块、客户库、报价计算器">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* 布局：首页（订单列表 + 资料库侧栏）→ 订单菜单（单据卡片）→ 模块（步骤 | 表单 | A4 预览） */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#eef1f5; --line:#dce1e8; --line-2:#c9d0da;
  --ink:#152033; --ink-2:#465264; --ink-3:#7b8595;
  --brand:#1c4f8a; --brand-ink:#ffffff; --brand-soft:#e2eaf5;
  --stamp:#b8322a; --stamp-soft:#f7e4e2;
  --ok:#1d7248; --ok-soft:#e0f1e8; --warn:#9a5b00; --warn-soft:#faefd9;
  --desk:#d9dee6; --paper:#ffffff; --paper-ink:#1a1d22;
  --shadow:0 1px 2px rgba(18,32,56,.06),0 6px 20px rgba(18,32,56,.06);
  --f-ui:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#151c26; --surface-2:#1b2430; --line:#28323f; --line-2:#36414f;
  --ink:#e4e9f0; --ink-2:#a8b3c2; --ink-3:#768296;
  --brand:#74a6e4; --brand-ink:#0a1220; --brand-soft:#1b2b41;
  --stamp:#e0675d; --stamp-soft:#3a1f1d;
  --ok:#5fc393; --ok-soft:#15302a; --warn:#e3a84e; --warn-soft:#352a16;
  --desk:#0a0e14; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#151c26; --surface-2:#1b2430; --line:#28323f; --line-2:#36414f;
  --ink:#e4e9f0; --ink-2:#a8b3c2; --ink-3:#768296;
  --brand:#74a6e4; --brand-ink:#0a1220; --brand-soft:#1b2b41;
  --stamp:#e0675d; --stamp-soft:#3a1f1d;
  --ok:#5fc393; --ok-soft:#15302a; --warn:#e3a84e; --warn-soft:#352a16;
  --desk:#0a0e14; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-ui);-webkit-font-smoothing:antialiased}
table{font-size:inherit;border-collapse:collapse}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* 顶栏 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand b{display:block;font-size:15px;letter-spacing:.02em}
.brand small{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.08em}
.seal{display:grid;place-items:center;width:32px;height:32px;border:2px solid var(--stamp);color:var(--stamp);border-radius:6px;font-weight:700;font-size:16px;transform:rotate(-6deg)}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--ink-3);font-size:13px;min-width:0}
.crumbs button{background:none;border:0;padding:2px 4px;color:var(--ink-2);border-radius:4px}
.crumbs button:hover{background:var(--surface-2);color:var(--ink)}
.crumbs span.cur{color:var(--ink);font-weight:600}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.proto{font-size:11px;letter-spacing:.06em;color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:99px;white-space:nowrap}

/* 通用 */
.wrap{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:24px 48px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);padding:7px 14px;border-radius:6px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.s-询价,.pill.s-报价{background:var(--brand-soft);color:var(--brand)}
.pill.s-确认,.pill.s-生产{background:var(--warn-soft);color:var(--warn)}
.pill.s-出货{background:var(--stamp-soft);color:var(--stamp)}
.pill.s-收款,.pill.s-完结{background:var(--ok-soft);color:var(--ok)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-title h2{font-size:15px}

/* 首页 */
.home{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.home-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.home-hero h1{font-size:24px;letter-spacing:.01em}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:20px}
.stat b{display:block;font-size:22px;font-family:var(--f-num);font-weight:500}
.stat span{font-size:12px;color:var(--ink-3)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:6px;padding:0 10px;background:var(--surface)}
.search>span{flex:none;white-space:nowrap}
.search input{border:0;outline:0;background:transparent;padding:7px 0;width:100%}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid transparent;background:transparent;padding:4px 10px;border-radius:99px;font-size:12px;color:var(--ink-2)}
.chip:hover{background:var(--surface-2)}
.chip.on{background:var(--ink);color:var(--surface)}
.olist{overflow-x:auto}
.orow{display:grid;grid-template-columns:96px minmax(180px,1.6fr) minmax(140px,1fr) 70px 120px 88px 36px;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;min-width:760px}
.orow:hover{background:var(--surface-2)}
.orow.head{cursor:default;background:transparent;font-size:12px;color:var(--ink-3);padding-block:8px}
.orow.head:hover{background:transparent}
.orow .no{font-family:var(--f-num);font-size:13px;color:var(--ink-2)}
.orow .nm b{display:block;font-weight:600}
.orow .nm small{color:var(--ink-3);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow .amt{text-align:right;font-family:var(--f-num)}
.orow .dt{font-size:12px;color:var(--ink-3);font-family:var(--f-num)}
.empty{padding:40px 16px;text-align:center;color:var(--ink-3)}
.side-group{margin-bottom:22px}
.side-group h3{font-size:12px;letter-spacing:.1em;color:var(--ink-3);margin-bottom:8px;font-weight:600}
.lib{display:grid;gap:6px}
.lib button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.lib button:hover{border-color:var(--brand)}
.lib .ic{display:grid;place-items:center;width:34px;height:34px;border-radius:6px;background:var(--brand-soft);color:var(--brand);font:600 11px var(--f-num);flex:none}
.lib b{display:block;font-size:13px}
.lib small{display:block;font-size:12px;color:var(--ink-3)}
.lib .cnt{margin-left:auto;font-family:var(--f-num);font-size:12px;color:var(--ink-3)}

/* 订单菜单 */
.ord-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.title-in{font-size:24px;font-weight:700;border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 6px;margin-left:-7px;max-width:100%}
.title-in:hover,.title-in:focus{border-color:var(--line-2);background:var(--surface)}
.ord-head p{margin:2px 0 0;color:var(--ink-3);font-size:13px}
.ord-head-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.track{display:flex;gap:0;margin-bottom:22px;overflow-x:auto}
.track button{flex:1 0 80px;background:none;border:0;border-top:3px solid var(--line);padding:8px 4px 0;text-align:left;font-size:12px;color:var(--ink-3)}
.track button.done{border-top-color:var(--brand);color:var(--ink-2)}
.track button.cur{border-top-color:var(--stamp);color:var(--ink);font-weight:600}
.track button:hover{color:var(--ink)}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:28px}
.sum .panel{padding:14px 16px;min-width:0}
.sum h3{font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.06em;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.sum .big{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.sum .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px;margin-top:6px}
.sum .kv span{color:var(--ink-3)}
.sum .kv b{font-weight:500;overflow-wrap:anywhere}
.sum select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:4px 6px;font-size:12.5px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mcard{position:relative;display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-height:132px}
.mcard:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.mcard .code{font:500 12px var(--f-num);color:var(--brand);border:1.5px solid currentColor;border-radius:4px;padding:1px 6px;align-self:flex-start;letter-spacing:.04em}
.mcard b{font-size:15px}
.mcard small{color:var(--ink-3);font-size:12.5px;line-height:1.45}
.mcard .st{margin-top:auto;font-size:12px;display:flex;align-items:center;gap:6px}
.mcard .st.ok{color:var(--ok)} .mcard .st.warn{color:var(--warn)} .mcard .st.ph{color:var(--ink-3)}
.mcard .need{position:absolute;top:14px;right:14px;font-size:11px;color:var(--stamp);background:var(--stamp-soft);padding:1px 7px;border-radius:99px}
.mcard.dim{background:var(--surface-2)}
.mgroup{margin-bottom:26px}

/* 模块页 */
.mod-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.mod-head h1{font-size:17px;display:flex;align-items:center;gap:10px}
.mod-head .code{font:500 12px var(--f-num);color:var(--brand);border:1.5px solid currentColor;border-radius:4px;padding:1px 6px}
.mod-head .ord{font-size:12.5px;color:var(--ink-3)}
.mod-head .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.mod{display:grid;grid-template-columns:188px minmax(0,1fr) minmax(0,1.1fr);height:calc(100dvh - 118px);min-height:520px}
.mod.expand{grid-template-columns:188px minmax(0,1fr)}
.mod.expand .form{display:none}
.steps{border-right:1px solid var(--line);padding:14px 10px;overflow:auto;background:var(--surface)}
.steps .lbl{font-size:11px;letter-spacing:.1em;color:var(--ink-3);padding:0 8px 8px;font-weight:600}
.step{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:6px;margin-bottom:2px;border-left:3px solid transparent}
.step:hover{background:var(--surface-2)}
.step.on{background:var(--brand-soft);border-left-color:var(--brand)}
.step b{font-size:13.5px;font-weight:600}
.step small{font-size:11.5px}
.step small.ok{color:var(--ok)} .step small.warn{color:var(--warn)}
.steps .hint{margin-top:14px;padding:10px;border-radius:6px;background:var(--surface-2);font-size:12px;color:var(--ink-2);line-height:1.5}
.form{overflow:auto;padding:20px 22px 40px;min-width:0}
.form-head{margin-bottom:16px}
.form-head h2{font-size:18px}
.form-head p{margin:4px 0 0;color:var(--ink-3);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.w2{grid-column:1/-1}
.sub{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:8px;margin-top:4px;border-top:1px dashed var(--line)}
.sub:first-child{border-top:0;padding-top:0;margin-top:0}
.sub span{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--ink-2)}
.fi{display:flex;flex-direction:column;gap:5px;min-width:0}
.fi label{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fi label .req{color:var(--stamp)}
.tag{font:500 10px var(--f-num);padding:0 5px;border-radius:3px;letter-spacing:.03em;border:1px solid currentColor}
.tag.S{color:var(--brand)} .tag.B{color:var(--ok)} .tag.FF{color:var(--warn)} .tag.CB{color:var(--stamp)} .tag.F{color:var(--ink-3)}
.fi input,.fi select,.fi textarea,.cell{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:7px 10px;min-width:0}
.fi textarea{resize:vertical;min-height:64px;line-height:1.5}
.fi input:focus,.fi select:focus,.fi textarea:focus,.cell:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.fi.chk{flex-direction:row;align-items:center;gap:8px}
.fi.chk input{width:auto}
.flash{animation:flash 1.2s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px var(--stamp-soft);border-color:var(--stamp)}100%{box-shadow:none}}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tbl{width:100%;min-width:720px}
.tbl th{font-size:11.5px;font-weight:600;color:var(--ink-3);text-align:left;padding:8px 6px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:4px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .cell{padding:5px 7px;border-color:transparent;background:transparent;border-radius:4px}
.tbl .cell:hover{border-color:var(--line-2)}
.tbl .calc{font-family:var(--f-num);font-size:12.5px;color:var(--ink-2);text-align:right;padding-right:10px;white-space:nowrap}
.tbl .ix{color:var(--ink-3);font-size:12px;text-align:center;width:28px}
.tbl .del{border:0;background:none;color:var(--ink-3);padding:4px 8px;border-radius:4px}
.tbl .del:hover{color:var(--stamp);background:var(--stamp-soft)}
.tbl tfoot td{font-family:var(--f-num);font-size:12.5px;font-weight:500;background:var(--surface-2);padding:8px 6px}
.tbl-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.form-foot{display:flex;justify-content:space-between;gap:8px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:10px 12px;margin-top:12px;line-height:1.55}

/* 预览 */
.pv{display:flex;flex-direction:column;background:var(--desk);border-left:1px solid var(--line);min-width:0}
.pv-bar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:0;background:transparent;padding:6px 10px;border-radius:5px;font-size:12.5px;color:var(--ink-2)}
.tab:hover{background:var(--surface-2)}
.tab.on{background:var(--ink);color:var(--surface)}
.pv-bar .r{margin-left:auto;display:flex;gap:4px;align-items:center}
.pv-bar .tip{font-size:11.5px;color:var(--ink-3)}
.pv-wrap{flex:1;overflow:auto;padding:16px 12px 40px}
.pv-hold{margin:0 auto;position:relative}
.pv-scale{width:794px;transform-origin:top left;position:absolute;top:0;left:0}

/* A4 单据：纸张在两种主题下都保持白底 */
.paper{width:794px;min-height:1123px;background:var(--paper);color:var(--paper-ink);padding:52px 56px 60px;font:10.5px/1.5 "IBM Plex Sans","Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.18);--acc:#1d3f72}
.paper .fld{cursor:pointer;border-radius:2px;transition:background .15s}
.paper .fld:hover{background:rgba(29,79,138,.12);outline:1px dashed var(--acc)}
.paper .fld.miss{color:#b8322a;background:rgba(184,50,42,.08);font-style:italic}
.d-head{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}
.d-co{font-size:15px;font-weight:700;color:var(--acc);margin-bottom:4px}
.d-seller{max-width:52%;color:#444}
.d-title{text-align:right}
.d-title h1{font-size:22px;letter-spacing:.06em;color:var(--acc);font-weight:700;margin-bottom:8px}
.d-meta{margin-left:auto}
.d-meta th{text-align:right;font-weight:500;color:#777;padding:1px 8px 1px 0;white-space:nowrap}
.d-meta td{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:10px}
.d-rule{height:3px;background:var(--acc);margin:16px 0 18px}
.d-two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.d-box{border:1px solid #d9dde3;padding:10px 12px;border-radius:2px}
.d-lab{font-size:9px;letter-spacing:.14em;color:var(--acc);font-weight:700;margin-bottom:4px}
.d-strong{font-weight:700}
.d-terms{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 14px;background:#f4f6f9;padding:10px 12px;margin-bottom:14px}
.d-terms>div>span:first-child{display:block;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:#7b8594}
.d-tbl{width:100%;border:1px solid #cfd4db}
.d-tbl th{background:var(--acc);color:#fff;font-weight:600;font-size:9.5px;padding:6px 5px;text-align:center;border:1px solid var(--acc)}
.d-tbl td{border:1px solid #d9dde3;padding:5px;vertical-align:top}
.d-tbl .c{text-align:center} .d-tbl .r{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:10px;white-space:nowrap}
.d-tbl .b{font-weight:600}
.d-tbl tr.tot td{background:#f4f6f9;font-weight:700}
.d-sub{color:#777;font-size:9.5px}
.d-words{margin:10px 0;padding:8px 10px;border-left:3px solid var(--acc);background:#f7f8fa;font-weight:600}
.d-sec{margin-top:14px}
.d-sec h4{font-size:9.5px;letter-spacing:.12em;color:var(--acc);margin:0 0 4px}
.d-sec ol{margin:0;padding-left:16px}
.d-pre{white-space:pre-line}
.d-sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:34px}
.d-sigline{height:56px;border-bottom:1px solid #333;position:relative;margin-bottom:4px}
.stamp-slot{position:absolute;left:20px;bottom:6px;width:70px;height:70px;border:1.5px dashed #b8322a;border-radius:50%;display:grid;place-items:center;color:#b8322a;font-size:9px;opacity:.7}
.d-center{text-align:center}
.d-ctitle{font-size:24px;letter-spacing:.5em;font-weight:700;text-indent:.5em}
.d-csub{letter-spacing:.3em;color:#777;font-size:10px;margin-top:4px}
.d-cl{display:grid;grid-template-columns:170px 1fr;gap:3px 12px;margin-top:12px}
.d-cl dt{font-weight:600}
.d-cl dd{margin:0}

/* ---------- 计算 ---------- */
function calc(o){
  let qty=0,amount=0,ctns=0,nw=0,gw=0,cbm=0,c=0;
  const rows=o.items.map(it=>{
    const q=+it.qty||0,p=+it.price||0,a=q*p,per=+it.pcsPerCtn||0,n=per>0?Math.ceil(q/per):0;
    const from=n?c+1:0,to=n?c+n:0;c+=n;
    const v=(+it.l||0)*(+it.w||0)*(+it.h||0)/1e6;
    const r=Object.assign({},it,{q,p,a,n,from,to,nwT:n*(+it.nw||0),gwT:n*(+it.gw||0),cbmT:n*v});
    qty+=q;amount+=a;ctns+=n;nw+=r.nwT;gw+=r.gwT;cbm+=r.cbmT;return r;
  });
  return {rows,qty,amount,ctns,nw,gw,cbm};
}

function stepPaths(step){
  const s=STEPS[step];const out=(s.fields||[]).filter(f=>f.p).map(f=>f.p);
  if(s.table)TABLES[s.table].filter(c=>c.k).forEach(c=>out.push('items.*.'+c.k));
  return out;
}
function missing(o,step){
  const s=STEPS[step],out=[];
  (s.fields||[]).forEach(f=>{if(f.show&&!f.show(o))return;if(f.req&&!String(getP(o,f.p)==null?'':getP(o,f.p)).trim())out.push(f.l)});
  if(s.table==='items'){if(!o.items.length)out.push('至少一行货物');o.items.forEach((it,i)=>{if(!it.nameEn)out.push('第'+(i+1)+'行品名');if(!(+it.qty))out.push('第'+(i+1)+'行数量');if(!(+it.price))out.push('第'+(i+1)+'行单价')})}
  if(s.table==='packing')o.items.forEach((it,i)=>{if(!(+it.pcsPerCtn))out.push('第'+(i+1)+'行每箱装');if(!(+it.gw))out.push('第'+(i+1)+'行毛重');if(!(+it.l&&+it.w&&+it.h))out.push('第'+(i+1)+'行箱规')});
  if(s.table==='customsItems')o.items.forEach((it,i)=>{if(!it.nameCn)out.push('第'+(i+1)+'行中文品名');if(!it.hs)out.push('第'+(i+1)+'行商品编号')});
  return out;
}
function modProgress(o,key){const m=MODS[key];if(!m.steps)return null;const done=m.steps.filter(s=>!missing(o,s).length).length;return {done,total:m.steps.length}}
function neededMods(o){
  const n=new Set(['quote','pi','ci','pl','marks','export','payment']);
  if(o.terms.transport!=='快递')n.add('customs');
  if(o.terms.transport==='海运'){n.add('booking');n.add('bl')}
  if(/L\/C/.test(o.terms.payment))n.add('lc');
  return n;
}

function updateCalcs(){

  if(!w||!s||!h||!s.firstElementChild)return;
  const sc=Math.min(1.25,Math.max(.3,(w.clientWidth-24)/794));

}
function jumpTo(path){
  const m=MODS[V.mod];if(!m||!m.steps)return;

  if(!step){toast('这一项在本订单的其它模块里填写（如「合同 / PI」的货物明细）');return}
  if(V.expand){V.expand=false;V.step=step;render()}

}

/* ---------- 报价计算器 ---------- */
const CALC_F=[['buy','采购单价（含税）','CNY / 件',45],['pack','包装成本','CNY / 件',3],['qty','数量','件',1000],['inland','国内运费（整票）','CNY',800],['port','报关 / 港杂（整票）','CNY',650],['freight','海运费（整票）','USD',1200],['ins','保险费率','%',0.3],['vat','增值税率','%',13],['rebate','出口退税率','%',13],['rate','汇率','CNY / USD',7.1],['margin','目标利润率','%',15],['quoteFob','客户还价（FOB 单价，可选）','USD',0]];
function pageCalc(){
  return topbar('<button data-act="go" data-page="home">首页</button><span>/</span><span class="cur">报价计算器</span>')+
  '<main class="wrap"><div class="sec-title"><div><div class="eyebrow">小工具</div><h1 style="font-size:22px">报价计算器</h1></div></div><div class="calc-g">'+
  '<div class="panel"><div class="grid">'+CALC_F.map(f=>'<div class="fi'+(f[0]==='quoteFob'?' w2':'')+'"><label for="q-'+f[0]+'">'+f[1]+' <span class="muted">'+f[2]+'</span></label><input id="q-'+f[0]+'" class="num" data-q="'+f[0]+'" inputmode="decimal" value="'+f[3]+'"></div>').join('')+'</div></div>'+
  '<div class="panel" id="calc-out"></div></div></main>';
}
function runCalc(){
  const g=k=>{const el=document.getElementById('q-'+k);return el?(+el.value||0):0};
  const qty=Math.max(1,g('qty')),rate=g('rate')||1,m=g('margin')/100;
  const rebate=g('buy')/(1+g('vat')/100)*g('rebate')/100;
  const exwCost=g('buy')+g('pack')-rebate;
  const fobCost=exwCost+(g('inland')+g('port'))/qty;
  const exw=exwCost/(1-m)/rate,fob=fobCost/(1-m)/rate,cfr=fob+g('freight')/qty,cif=cfr/(1-1.1*g('ins')/100);
  const profit=(fob*rate-fobCost)*qty;
  const row=(n,v,desc,hl)=>'<tr'+(hl?' class="hl"':'')+'><td><b style="font-family:var(--f-ui);color:var(--ink);font-size:14px">'+n+'</b><div class="muted" style="font-size:12px;font-family:var(--f-ui)">'+desc+'</div></td><td><b>$'+money(v)+'</b></td><td>$'+money(v*qty)+'</td></tr>';
  let rev='';
  const qf=g('quoteFob');
  if(qf>0){const mm=1-fobCost/(qf*rate);rev='<div class="note" style="margin-top:14px">按客户还价 FOB $'+money(qf)+'：利润率 <b>'+fx(mm*100,1)+'%</b>，整单利润约 <b>¥'+money((qf*rate-fobCost)*qty)+'</b>'+(mm<0.05?'，<b style="color:var(--stamp)">低于 5%，建议谨慎</b>':'')+'。</div>'}
  document.getElementById('calc-out').innerHTML='<div class="eyebrow" style="margin-bottom:6px">按目标利润率 '+fx(m*100,1)+'% 报价</div><table class="qt"><thead><tr><th>贸易术语</th><th>单价</th><th>整单</th></tr></thead><tbody>'+
  row('EXW',exw,'工厂交货，不含国内运费和报关')+row('FOB',fob,'含国内运费、报关港杂',1)+row('CFR',cfr,'FOB + 海运费')+row('CIF',cif,'CFR + 保险（110% 投保）')+'</tbody></table>'+
  '<div class="note" style="margin-top:14px">单件成本 ¥'+money(fobCost)+'（其中退税抵减 ¥'+money(rebate)+'）· FOB 整单利润约 <b>¥'+money(profit)+'</b></div>'+rev;
}

  genBundle:()=>{const names=V.expSel.map(d=>(EXPDOCS.find(x=>x[0]===d)||[])[1]);toast('原型演示：正式版会生成 '+CUR.name+'_'+V.bundle+'.zip，含 '+names.join('、'))},
  copyMail:()=>{const t=document.getElementById('mail');const done=()=>toast('邮件正文已复制');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(done).catch(()=>{t.select();toast('已选中，按 Ctrl+C 复制')});else{t.select();toast('已选中，按 Ctrl+C 复制')}},
  custSel:d=>{V.custId=d.id;render()},
  newCustomer:()=>{const c={id:uid(),name:'New Customer Co., Ltd.',short:'',country:'',address:'',tax:'',notify:'',level:'B',source:'',contacts:[{name:'',title:'',email:'',phone:''}],habits:{incoterm:'FOB',place:'Qingdao',payment:'T/T 电汇',payDeposit:30,payBalanceAt:'before shipment',payDays:'',payCustom:'',currency:'USD',pod:'',marks:''},notes:'',follow:[]};S.customers.unshift(c);V.custId=c.id;save();render();toast('已新建客户，请完善资料')},
  addFollow:()=>{const el=document.getElementById('follow-in');const c=S.customers.find(x=>x.id===V.custId);if(!el.value.trim()||!c)return;c.follow=c.follow||[];c.follow.unshift({d:today(),t:el.value.trim()});save();render()},
  ptype:d=>{V.ptype=d.t;render()},
  soon:d=>toast('「'+d.t+'」在正式版中提供，原型暂不演示'),
  resetDemo:()=>{S=seed();save();V=Object.assign(V,{page:'home',orderId:null,mod:null,q:'',status:'all',custId:null,expSel:null});render();toast('已恢复示例数据')},
  closeModal:(d,t,e)=>{if(e.target===t)closeModal()}
};
function afterExport(){if(V.page==='module'&&MODS[V.mod].special){const el=document.getElementById('pvscale');if(el){el.innerHTML=DOCS[V.expDoc](CUR);fit();const w=document.getElementById('pvwrap');if(RO)RO.disconnect();if(window.ResizeObserver){RO=new ResizeObserver(fit);RO.observe(w)}}}}

app.addEventListener('click',e=>{
  const f=e.target.closest('.paper [data-f]');
  if(f&&V.page==='module'&&MODS[V.mod].steps){jumpTo(f.dataset.f);return}
  const t=e.target.closest('[data-act]');
  if(t&&ACT[t.dataset.act]){e.preventDefault();ACT[t.dataset.act](t.dataset,t,e)}
});
app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('orow')){e.preventDefault();e.target.click()}});
document.getElementById('modal-root').addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&ACT[t.dataset.act]){ACT[t.dataset.act](t.dataset,t,e)}});
function onEdit(e){
  const t=e.target;
  if(t.id==='home-q'){if(e.type!=='input')return;V.q=t.value;const pos=t.selectionStart;render();const n=document.getElementById('home-q');n.focus();n.setSelectionRange(pos,pos);return}
  if(t.id==='cust-q'){if(e.type!=='input')return;V.cq=t.value;const pos=t.selectionStart;render();const n=document.getElementById('cust-q');n.focus();n.setSelectionRange(pos,pos);return}
  if(t.dataset.q!=null){runCalc();return}
  if(t.dataset.exp!=null){if(e.type!=='change')return;const k=t.dataset.exp;V.expSel=t.checked?V.expSel.concat(k):V.expSel.filter(x=>x!==k);if(t.checked)V.expDoc=k;render();return}
  if(t.dataset.cp!=null){const c=S.customers.find(x=>x.id===V.custId);if(!c)return;setP(c,t.dataset.cp,t.value);save();const pt=document.getElementById('cust-paytext');if(pt)pt.textContent=payText(c.habits);if(t.dataset.cp==='name'){const n=document.getElementById('cn-'+c.id);if(n)n.textContent=t.value}return}
  if(t.dataset.p!=null&&CUR){
    if(t.type==='checkbox'&&e.type!=='change')return;
    setP(CUR,t.dataset.p,t.type==='checkbox'?t.checked:t.value);CUR.updated=today();
    const key=t.dataset.p.split('.')[1];
    if(t.dataset.p==='terms.paymentText'){if(!CUR.terms.paymentManual){CUR.terms.paymentManual=true;const lb=document.querySelector('label[for="in-terms-paymentText"] .muted');if(lb)lb.outerHTML='<button class="btn ghost sm" data-act="payReset" style="margin-left:auto">恢复自动生成</button>'}}
    else if(t.dataset.p.startsWith('terms.')&&PAYF.includes(key)){syncPay(CUR);const ta=document.getElementById('in-terms-paymentText');if(ta&&!CUR.terms.paymentManual)ta.value=CUR.terms.paymentText}
    save();
    if(V.page==='module'){if(t.dataset.rr&&e.type==='change'){const fm=document.getElementById('form'),y=fm.scrollTop;renderForm();fm.scrollTop=y}renderPreview();renderNav();updateCalcs()}
  }
}
app.addEventListener('input',onEdit);
app.addEventListener('change',onEdit);
window.addEventListener('resize',fit);

render();
})();
</script>
