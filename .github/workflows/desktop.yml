name: 桌面安装包

on:
  push:
    branches: [main, claude/trade-workbench-planning-m8vr3k]
    paths: ['app/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 类型检查与单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: 打包 ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: ''
            rust-targets: ''
            bundle: app/src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS
            platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: 安装前端依赖
        working-directory: app
        run: npm ci
      - name: 构建安装包
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: app
          args: ${{ matrix.args }}
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: 外贸超级工作台-${{ matrix.name }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
          retention-days: 30
      - name: Windows 冒烟测试（启动程序并点开各页面）
        if: matrix.name == 'Windows'
        working-directory: app
        shell: pwsh
        run: |
          # 仅测试用：带调试端口重新编译一份（发布的安装包不含调试端口）
          npx tauri build --no-bundle --config src-tauri/tauri.smoke.json
          $env:SMOKE_OUT = "smoke"
          $p = Start-Process -FilePath "src-tauri/target/release/trade-workbench.exe" -PassThru
          # 等调试端口就绪（最多 90 秒），期间若程序退出则打印退出码
          $ready = $false
          for ($i = 0; $i -lt 90 -and -not $ready; $i++) {
            if ($p.HasExited) { Write-Host "程序已退出，退出码 $($p.ExitCode)"; break }
            try { Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 http://127.0.0.1:9222/json/version | Out-Null; $ready = $true } catch { Start-Sleep -Seconds 1 }
          }
          Write-Host "调试端口就绪: $ready，用时约 $i 秒，程序仍在运行: $(-not $p.HasExited)"
          node scripts/smoke-cdp.mjs
          $code = $LASTEXITCODE
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          exit $code
      - name: 上传冒烟测试截图
        if: always() && matrix.name == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-screenshots
          path: app/smoke/*.png
          if-no-files-found: ignore
          retention-days: 7
